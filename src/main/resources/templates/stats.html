<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>나의 예약 내역 | SKALA Rooms</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="app-shell">
    <div th:replace="~{fragments/header :: header(${active}, ${member})}"></div>
    <section class="hero sub-hero"><div><p class="kicker light">MY RESERVATION HISTORY</p><h1>나의 예약 내역</h1><p>내가 예약한 회의실 일정과 지금까지의 이용 기록을 확인합니다.</p></div><div class="summary-card stats-summary-card"><div><strong th:text="${totals.reservations}">0</strong><small>전체 예약</small></div><div><strong th:text="${totals.completed}">0</strong><small>이용 후 인증</small></div><div><strong th:text="${totals.upcoming}">0</strong><small>예정 예약</small></div><div><strong th:text="${#numbers.formatDecimal(totals.minutes / 60.0, 1, 1)}">0.0</strong><small>누적 이용 시간</small></div></div></section>
    <section class="content-section stats-content">
        <div class="section-head history-head"><div><p class="kicker">RESERVATION LIST</p><h2>예약 목록</h2><p>내가 예약한 내역을 최근 순서로 확인할 수 있어요.</p></div><strong th:text="${history.size() + '건'}">0건</strong></div>
        <div class="history-list">
            <article th:each="item : ${history}"><div class="history-date"><strong th:text="${item.date}">날짜</strong><span th:text="${item.reservation.roomCode + '호 회의실'}">회의실</span></div><div class="history-main"><span class="title-with-state"><h3 th:text="${item.reservation.purpose}">목적</h3><i class="state" th:classappend="${item.stateClass}" th:text="${item.stateLabel}">상태</i></span><p th:text="${item.reservation.peopleCount + '명 · 본인 예약'}">예약 정보</p></div><div class="history-time"><strong th:text="${item.range}">09:00~10:00</strong><span th:text="${item.duration}">1시간</span></div><div class="proof-state" th:classappend="${item.proofComplete} ? 'complete'" th:text="${item.proofLabel}">이용 예정</div></article>
            <div class="empty" th:if="${history.isEmpty()}"><strong>아직 예약 기록이 없습니다.</strong></div>
        </div>
    </section>
</main>
</body>
</html>
