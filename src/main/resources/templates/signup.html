<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | SKALA Rooms</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-story signup-story">
        <div class="auth-brand"><img th:src="@{/skala-logo-transparent.png}" alt="SKALA"><span>ROOMS</span></div>
        <div><p class="kicker light">JOIN SKALA ROOMS</p><h1><span>간단한 가입으로</span><em>바로 시작하세요.</em></h1><p class="auth-description">교육생 번호와 안전한 비밀번호로 가입합니다.</p></div>
        <small>간편 가입 · U번호 중복 방지 · 안전한 비밀번호</small>
    </section>
    <section class="auth-panel">
        <div class="auth-card">
            <a class="back-link" th:href="@{/login}">← 로그인으로 돌아가기</a>
            <p class="kicker">CREATE ACCOUNT</p>
            <h2>회원가입</h2>
            <p class="auth-copy">교육생 본인 정보를 정확히 입력해주세요.</p>
            <div class="alert error" th:if="${param.error != null and param.error[0] == 'format'}">교육생 번호는 U000 형식으로 입력해주세요.</div>
            <div class="alert error" th:if="${param.error != null and param.error[0] == 'password'}">비밀번호는 8자 이상이며 영문과 특수문자를 각각 1개 이상 포함해야 합니다.</div>
            <div class="alert error" th:if="${param.error != null and param.error[0] == 'duplicate'}">이미 가입된 교육생 번호입니다.</div>
            <div class="alert error" th:if="${param.error != null and param.error[0] == 'access'}">가입용 접근 코드를 확인해주세요.</div>
            <div class="alert error" th:if="${param.error != null and param.error[0] == 'required'}">입력 내용을 다시 확인해주세요.</div>
            <form class="stack-form" th:action="@{/signup}" method="post">
                <label>교육생 번호<input name="memberCode" th:value="${memberCode}" placeholder="U000" pattern="U[0-9]{3,}" autocomplete="username" required><small>예: U039</small></label>
                <label>이름<input name="name" placeholder="이름" maxlength="80" autocomplete="name" required></label>
                <label>비밀번호<input name="password" type="password" placeholder="8자 이상 · 영문 및 특수문자 포함" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[^A-Za-z0-9 ]).{8,}" title="8자 이상이며 영문과 특수문자를 각각 1개 이상 포함해주세요." autocomplete="new-password" required><small>예: Skala!2026 · 공백은 사용할 수 없습니다.</small></label>
                <label th:if="${signupAccessCodeRequired}">가입용 접근 코드<input name="accessCode" type="password" placeholder="관리자에게 받은 코드" autocomplete="off" required><small>공개 테스트 서버의 무단 가입을 방지합니다.</small></label>
                <button class="primary-button" type="submit">회원가입 <span>→</span></button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
