<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>새 비밀번호 설정 | SKALA Rooms</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-story"><div class="auth-brand"><img th:src="@{/skala-logo-transparent.png}" alt="SKALA"><span>ROOMS</span></div><div><p class="kicker light">SECURE ACCOUNT</p><h1><span>새 비밀번호로</span><em>안전하게 변경하세요.</em></h1></div><small>영문·특수문자 포함 · 8자 이상</small></section>
    <section class="auth-panel"><div class="auth-card">
        <p class="kicker">NEW PASSWORD</p><h2>새 비밀번호 설정</h2><p class="auth-copy">다른 서비스에서 사용하지 않는 비밀번호를 권장합니다.</p>
        <div class="alert error" th:if="${param.error != null}">비밀번호는 8자 이상이며 영문과 특수문자를 각각 1개 이상 포함해야 합니다.</div>
        <form class="stack-form" th:action="@{/reset-password}" method="post">
            <input name="token" type="hidden" th:value="${token}">
            <label>새 비밀번호<input name="password" type="password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[^A-Za-z0-9 ]).{8,}" autocomplete="new-password" required><small>8자 이상 · 영문 및 특수문자 포함 · 공백 사용 불가</small></label>
            <button class="primary-button" type="submit">비밀번호 변경 <span>→</span></button>
        </form>
    </div></section>
</main>
</body>
</html>
