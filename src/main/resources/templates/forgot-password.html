<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 찾기 | SKALA Rooms</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-story"><div class="auth-brand"><img th:src="@{/skala-logo-transparent.png}" alt="SKALA"><span>ROOMS</span></div><div><p class="kicker light">ACCOUNT RECOVERY</p><h1><span>인증된 이메일로</span><em>계정을 복구하세요.</em></h1></div><small>10분 만료 · 일회용 링크 · 가입 여부 비공개</small></section>
    <section class="auth-panel"><div class="auth-card">
        <a class="back-link" th:href="@{/login}">← 로그인으로 돌아가기</a>
        <p class="kicker">RESET PASSWORD</p><h2>비밀번호 찾기</h2><p class="auth-copy">가입할 때 인증한 이메일을 입력해주세요.</p>
        <div class="alert success" th:if="${param.notice != null}">가입된 이메일이라면 재설정 링크를 보냈습니다. 메일함을 확인해주세요.</div>
        <div class="alert error" th:if="${!mailReady or (param.error != null and (param.error[0] == 'mail-unavailable' or param.error[0] == 'mail-failed'))}">메일 발송을 잠시 사용할 수 없습니다.</div>
        <div class="alert error" th:if="${param.error != null and param.error[0] == 'invalid-token'}">재설정 링크가 만료됐거나 이미 사용됐습니다. 다시 요청해주세요.</div>
        <form class="stack-form" th:action="@{/forgot-password}" method="post">
            <label>이메일<input name="email" type="email" maxlength="254" placeholder="가입한 이메일" autocomplete="email" required></label>
            <button class="primary-button" type="submit" th:disabled="${!mailReady}">재설정 메일 받기 <span>→</span></button>
        </form>
    </div></section>
</main>
</body>
</html>
