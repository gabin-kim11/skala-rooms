spring:
  application:
    name: skala-rooms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/moimjari}
    username: ${DB_USERNAME:moimjari}
    password: ${DB_PASSWORD:moimjari_dev}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    validate-on-migrate: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope: openid,profile,email
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.security: INFO

app:
  signup-access-code: ${SIGNUP_ACCESS_CODE:}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:}
